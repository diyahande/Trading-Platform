services:
  database:
    image: postgres:16-alpine
    container_name: capstone-database
    env_file:
      - ./database/.env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock_trading"]
      interval: 10s
      timeout: 5s
      retries: 8
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - capstone-net

  db-init:
    image: postgres:16
    container_name: capstone-db-init
    working_dir: /workspace
    command: ["bash", "./apply.sh"]
    env_file:
      - ./database/.env
    environment:
      PGHOST: database
    volumes:
      - ./database:/workspace
    depends_on:
      database:
        condition: service_healthy
    networks:
      - capstone-net

  auth-stub:
    build:
      context: ./auth-stub
      dockerfile: Dockerfile
    container_name: capstone-auth-stub
    env_file:
      - ./database/.env
    ports:
      - "8089:8089"
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - capstone-net

  trade-api:
    build:
      context: ./trade-api
      dockerfile: Dockerfile
    container_name: capstone-trade-api
    env_file:
      - ./database/.env
    ports:
      - "8082:8082"
    depends_on:
      db-init:
        condition: service_completed_successfully
      auth-stub:
        condition: service_started
    networks:
      - capstone-net

# From outside the VM use these endpoints:
# - Postgres: <VM_IP>:5432
# - Auth Stub: http://<VM_IP>:8089
# - Trade API: http://<VM_IP>:8082

volumes:
  db_data:

networks:
  capstone-net:
    driver: bridge