spring:
  application:
    name: executor
  server:
    port: 8083
  datasource:
    url: jdbc:postgresql://localhost:5432/stock_trading_db
    username: postgres
    password: n3u3d4!
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: 10.8.78.68:8085
    consumer:
      group-id: trade-executor
      enable-auto-commit: false
      auto-offset-reset: earliest
    producer:
      acks: all
      retries: 3

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  type-aliases-package: com.capstone.executor.mapper
  configuration:
    map-underscore-to-camel-case: true

fauxnance:
  base-url: ${FAUXNANCE_BASE_URL:https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1}
  api-key: ${FAUXNANCE_API_KEY:fnx_dev_w94amk7F63WTtF8RTkdEESXffMagvsC0}
  max-retries: ${FAUXNANCE_MAX_RETRIES:3}
  retry-delay-ms: ${FAUXNANCE_RETRY_DELAY_MS:100}

market-data:
  # Market data poller interval in seconds
  # Minimum floor: 30 seconds (enforced in code to stay within quota)
  #
  # Quota calculation for 24 symbols:
  # - polls per day: 86400 / 30 = 2880
  # - batches per poll: 1 (24 symbols <= 25 limit)
  # - requests per day: 1440 * 1 = 1440
  #
  # For 2000 request/day quota target:
  # - required interval: 86400 / 2000 = 43.2 seconds minimum
  # - with batching, saves ~8x requests vs one-at-a-time
  poll-interval-seconds: ${POLL_INTERVAL_SECONDS:60}

logging:
  level:
    com.capstone.executor: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: INFO
