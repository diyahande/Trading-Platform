spring:
  application:
    name: executor
  server:
    port: ${EXECUTOR_SERVICE_PORT}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: trade-executor
      enable-auto-commit: false
      auto-offset-reset: earliest
    producer:
      acks: all
      retries: 3

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  type-aliases-package: com.capstone.executor.mapper
  configuration:
    map-underscore-to-camel-case: true

fauxnance:
  base-url: ${FAUXNANCE_BASE_URL}
  api-key: ${FAUXNANCE_API_KEY}
  max-retries: ${FAUXNANCE_MAX_RETRIES}
  retry-delay-ms: ${FAUXNANCE_RETRY_DELAY_MS}

market-data:
  poll-interval-seconds: ${POLL_INTERVAL_SECONDS}

logging:
  level:
    com.capstone.executor: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: INFO
