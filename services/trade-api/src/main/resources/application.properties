### Spring Boot Application Configuration ###

# Server configuration
server.port=${SERVER_PORT}
server.servlet.context-path=/

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.capstone=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Jackson Configuration
jwt.secret=${JWT_SECRET}

# Kafka producer configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=1000
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# Topic bindings
app.kafka.topics.orders=${KAFKA_ORDERS_TOPIC}

# Kafka consumer configuration
spring.kafka.consumer.group-id=watchlist-service-1
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.max-poll-records=100
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.auto-commit-interval-ms=3000

# Fauxnance market data for dashboard valuation
fauxnance.base-url=${FAUXNANCE_BASE_URL:}
fauxnance.api-key=${FAUXNANCE_API_KEY:}

# Internal order-notification call to auth-service
auth.notifications.base-url=${AUTH_NOTIFICATIONS_BASE_URL:http://localhost:3000}
auth.notifications.order-placed-path=${AUTH_NOTIFICATIONS_ORDER_PLACED_PATH:/auth/notifications/order-placed}
auth.notifications.internal-token=${AUTH_NOTIFICATIONS_INTERNAL_TOKEN:}

# Application Name
spring.application.name=trade-api
