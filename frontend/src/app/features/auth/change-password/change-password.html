<section class="auth-panel" aria-label="TradeX change password">
	<div class="chart-bg" aria-hidden="true">
		<svg viewBox="0 0 800 520" preserveAspectRatio="none">
			<polyline points="30,316 120,278 210,344 300,286 410,316 520,254 632,332 770,286" class="line" />
			<line x1="120" y1="292" x2="120" y2="266" class="segment up" />
			<line x1="300" y1="302" x2="300" y2="276" class="segment up" />
			<line x1="520" y1="270" x2="520" y2="244" class="segment up" />
			<line x1="632" y1="344" x2="632" y2="320" class="segment down" />
		</svg>
	</div>

	<div class="brand">Trade<span>X</span></div>

	<div class="auth-card">
		<h1>Change<span>Password</span></h1>
		<p class="description">Use your current password, then set a new one. You will be asked to sign in again after the update.</p>

		<div class="field">
			<label for="old-password">Current Password</label>
			<div class="password-wrap">
				<input id="old-password" [type]="showOldPassword ? 'text' : 'password'" placeholder="Enter current password" [(ngModel)]="oldPassword" />
				<button type="button" class="eye" (click)="toggleOldPasswordVisibility()">
					{{ showOldPassword ? 'Hide' : 'Show' }}
				</button>
			</div>
		</div>

		<div class="field">
			<label for="new-password">New Password</label>
			<div class="password-wrap">
				<input id="new-password" [type]="showNewPassword ? 'text' : 'password'" placeholder="Enter new password" [(ngModel)]="newPassword" />
				<button type="button" class="eye" (click)="toggleNewPasswordVisibility()">
					{{ showNewPassword ? 'Hide' : 'Show' }}
				</button>
			</div>
		</div>

		<div class="field">
			<label for="confirm-password">Confirm New Password</label>
			<div class="password-wrap">
				<input id="confirm-password" [type]="showConfirmPassword ? 'text' : 'password'" placeholder="Confirm new password" [(ngModel)]="confirmNewPassword" />
				<button type="button" class="eye" (click)="toggleConfirmPasswordVisibility()">
					{{ showConfirmPassword ? 'Hide' : 'Show' }}
				</button>
			</div>
		</div>

		<div *ngIf="error" class="error">{{ error }}</div>

		<button class="primary" type="button" [disabled]="loading" (click)="submit()">
			{{ loading ? 'Updating...' : 'Update Password' }}
		</button>

		<div class="footnote">
			<a routerLink="/dashboard">Back to Dashboard</a>
		</div>
	</div>
</section>
