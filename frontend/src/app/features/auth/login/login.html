<div class="login-container">
	<h2>Sign In</h2>
	<div *ngIf="!signedIn">
		<div class="form-group">
			<label for="username">Username</label>
			<input id="username" data-testid="signin-username" [(ngModel)]="username" />
		</div>

		<div class="form-group">
			<label for="password">Password</label>
			<input id="password" type="password" data-testid="signin-password" [(ngModel)]="password" />
		</div>

		<div *ngIf="error" class="error" data-testid="signin-error">{{error}}</div>

		<button (click)="submit()" [disabled]="loading" data-testid="signin-submit">{{loading ? 'Signing in...' : 'Sign In'}}</button>
	</div>

	<div *ngIf="signedIn" class="success" data-testid="signin-success">
		<p>Signed in successfully.</p>
		<button (click)="signOut()" data-testid="signout-button">Sign Out</button>
	</div>
</div>
