<section class="dash-panel" aria-label="TradeX dashboard">
  <div class="chart-bg" aria-hidden="true">
    <svg viewBox="0 0 900 560" preserveAspectRatio="none">
      <polyline points="20,460 100,430 180,440 260,385 340,405 420,352 500,365 580,300 660,315 740,268 820,290"
        class="line" />
      <line x1="100" y1="445" x2="100" y2="415" class="candle g" />

      <line x1="260" y1="398" x2="260" y2="372" class="candle g" />

    <h1>Welcome "{{ username }}"</h1>

    <div class="actions">
      <a routerLink="/login" class="ghost">Back To Login</a>
      <button type="button" class="primary" (click)="signOut()">Sign Out</button>
    </div>
  </main>
</section>
